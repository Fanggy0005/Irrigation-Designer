memory_limit = 512M

; The source is bind-mounted from Windows, where file reads are slow; caching compiled
; scripts and resolved paths keeps page loads fast. Changes are still picked up within ~1s.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600

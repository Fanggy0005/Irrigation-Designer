# Local development stack: Laravel app and Vite dev server, with SQLite in a volume.
#   podman compose up -d --build     then open http://localhost:8001
# Ports 8001 and 5174 leave 8000 and 5173 free for other projects. See README.md.
name: irrigation-designer

services:
    app:
        build:
            context: ./docker/php
            dockerfile: Containerfile
        image: localhost/irrigation-designer-php:dev
        ports:
            - '127.0.0.1:8001:8000'
        environment:
            # Real env vars take precedence over .env, so the same .env keeps working on the host.
            APP_URL: http://localhost:8001
            DB_CONNECTION: sqlite
            # SQLite's file locks are unreliable on the Windows bind mount, so the database
            # lives in a volume, apart from the host's database/database.sqlite.
            DB_DATABASE: /var/lib/irrigation-designer/database.sqlite
            PHP_CLI_SERVER_WORKERS: '4'
        volumes:
            - .:/var/www/html
            # Linux vendor kept off the Windows bind mount (faster, and separate from the host's).
            - vendor:/var/www/html/vendor
            - composer-cache:/root/.composer/cache
            - db-data:/var/lib/irrigation-designer

    vite:
        image: docker.io/library/node:22-bookworm-slim
        working_dir: /app
        entrypoint: ['sh', '/app/docker/node/entrypoint.sh']
        command: ['npx', 'vite']
        ports:
            - '127.0.0.1:5174:5174'
        environment:
            # laravel-vite-plugin: listen on 0.0.0.0 inside the container but write
            # http://localhost:<VITE_PORT> to public/hot for the browser.
            LARAVEL_SAIL: '1'
            VITE_PORT: '5174'
            APP_URL: http://localhost:8001
            # File change events don't cross the Windows mount, so poll once a second.
            CHOKIDAR_USEPOLLING: 'true'
            CHOKIDAR_INTERVAL: '1000'
        volumes:
            - .:/app
            # node_modules holds Linux binaries (esbuild, rollup), so it can't be shared with Windows.
            - node-modules:/app/node_modules

volumes:
    vendor:
    composer-cache:
    node-modules:
    db-data:
